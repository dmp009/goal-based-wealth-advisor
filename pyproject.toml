[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealthadvisor"
version = "0.1.0"
description = "Goal-based wealth advisor tool for a French bank advisor (educational, not investment advice)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy",
    "scipy",
    "PyPortfolioOpt",
    "scikit-learn",
    "yfinance",
    "duckdb>=1.1",
    "pandera>=0.24",
    "pydantic>=2",
    "pyyaml",
    "anthropic",
    "reportlab",
    "plotly",
    "streamlit>=1.50",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["wealthadvisor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
