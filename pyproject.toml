[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealthadvisor"
version = "0.1.0"
description = "Goal-based wealth advisor tool for a French bank advisor (educational, not investment advice)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "PyPortfolioOpt>=1.5,<2",
    "scikit-learn>=1.4",
    "yfinance>=0.2.40",
    "duckdb>=1.1",
    "pandera>=0.24",
    "pydantic>=2",
    "pyyaml>=6",
    "anthropic>=0.40",
    "reportlab>=4",
    "plotly>=5.20",
    "streamlit>=1.50",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["wealthadvisor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
